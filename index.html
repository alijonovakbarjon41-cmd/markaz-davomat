<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<title>O'quv markaz nazorat jurnali & O'qituvchi boshqaruvi</title>
<style>
:root {
  --bg: #EEF2F6;
  --pane: #FFFFFF;
  --pane-sub: #F8FAFC;
  --ink: #1E293B;
  --mut: #64748B;
  --line: #E2E8F0;
  --line-strong: #CBD5E1;
  --ac: #1E40AF;
  --ac-light: #EFF6FF;
  --ac-hover: #1D4ED8;
  --ok: #16A34A;
  --ok-light: #F0FDF4;
  --bad: #DC2626;
  --bad-light: #FEF2F2;
  --warn: #D97706;
  --warn-light: #FFFBEB;
  --info: #0284C7;
  --info-light: #F0F9FF;
  --side: #0F172A;
  --side-hover: #1E293B;
  --radius: 8px;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; min-height: 100vh; }
body {
  font: 14.5px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
}
h1 { font-size: 22px; margin: 0 0 4px; font-weight: 700; color: #0F172A; }
h2 { font-size: 16.5px; margin: 0 0 12px; font-weight: 650; color: #1E293B; }
h3 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
p { margin: 0 0 6px; }
.mut { color: var(--mut); }
small { color: var(--mut); }
a { color: var(--ac); cursor: pointer; text-decoration: none; }
a:hover { text-decoration: underline; }

button, .btn {
  font: inherit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--ac);
  color: #fff;
  border: 1px solid var(--ac);
  padding: 8px 16px;
  border-radius: var(--radius);
  cursor: pointer;
  font-weight: 500;
  transition: all 0.15s ease;
  min-height: 38px;
  touch-action: manipulation;
}
button:hover, .btn:hover { background: var(--ac-hover); border-color: var(--ac-hover); }
button:active, .btn:active { transform: translateY(1px); }
button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

button.ghost { background: #fff; color: var(--ac); border-color: var(--line-strong); }
button.ghost:hover { background: var(--ac-light); border-color: var(--ac); }
button.ghost.on { background: var(--ac); color: #fff; border-color: var(--ac); }

button.success { background: var(--ok); border-color: var(--ok); color: #fff; }
button.success:hover { background: #15803D; }

button.danger { background: #fff; color: var(--bad); border-color: #FECACA; }
button.danger:hover { background: var(--bad-light); border-color: var(--bad); }

button.sm, .btn.sm { padding: 4px 10px; font-size: 13px; min-height: 28px; border-radius: 6px; }
button.lg, .btn.lg { padding: 12px 22px; font-size: 16px; min-height: 46px; }

input, select, textarea {
  font: inherit;
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background: #fff;
  color: var(--ink);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: #3B82F6;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
}
label { display: block; margin-bottom: 14px; font-size: 13.5px; font-weight: 500; color: #334155; }
label span.desc { display: block; font-size: 12px; font-weight: 400; color: var(--mut); margin-top: 2px; }
label input, label select, label textarea { margin-top: 5px; }

/* Layout */
.shell { display: flex; min-height: 100vh; }
aside {
  width: 240px;
  background: var(--side);
  color: #CBD5E1;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  flex: none;
  z-index: 10;
}
.brand {
  padding: 20px 18px 16px;
  color: #FFFFFF;
  font-weight: 700;
  font-size: 17px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-icon {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, #3B82F6, #1E40AF);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: #fff;
}
.brand small { display: block; color: #94A3B8; font-weight: 400; font-size: 12px; margin-top: 2px; }

nav { padding: 12px 10px; flex: 1; overflow-y: auto; }
nav a {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  color: #CBD5E1;
  text-decoration: none;
  border-radius: 6px;
  margin-bottom: 3px;
  font-weight: 500;
  transition: all 0.15s ease;
}
nav a:hover { background: var(--side-hover); color: #fff; }
nav a.on { background: #1E293B; color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 #38BDF8; }
nav a .icon { font-size: 16px; width: 20px; text-align: center; }

.side-foot {
  padding: 14px 16px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  background: #0B1120;
}
.sync-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: #94A3B8;
  margin-bottom: 12px;
}
.sync-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #94A3B8;
  flex: none;
}
.sync-dot.green { background: #22C55E; box-shadow: 0 0 8px #22C55E; }
.sync-dot.yellow { background: #EAB308; }
.sync-dot.red { background: #EF4444; }
.side-foot button { width: 100%; background: transparent; color: #CBD5E1; border-color: #334155; }
.side-foot button:hover { background: #1E293B; color: #fff; }

main { flex: 1; min-width: 0; padding: 26px 32px 60px; max-width: 1360px; }
.head {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: flex-start;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.back { font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 8px; color: var(--mut); }
.back:hover { color: var(--ac); }

.card {
  background: var(--pane);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
}
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.grid2 > .card { margin-bottom: 0; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }

/* Stats cards */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.stat {
  background: var(--pane);
  border: 1px solid var(--line);
  border-left: 4px solid var(--ac);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.stat b { font-size: 24px; line-height: 1.2; font-weight: 700; color: #0F172A; }
.stat span { color: var(--mut); font-size: 13px; margin-top: 4px; }
.stat small.sub { font-size: 11.5px; color: #64748B; margin-top: 2px; }
.stat.green { border-left-color: var(--ok); }
.stat.green b { color: var(--ok); }
.stat.warn { border-left-color: var(--warn); }
.stat.warn b { color: var(--warn); }
.stat.blue { border-left-color: #3B82F6; }
.stat.bad { border-left-color: var(--bad); }
.stat.bad b { color: var(--bad); }

/* Tables */
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius); border: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 14px; background: #fff; }
th {
  text-align: left;
  font-weight: 600;
  color: var(--mut);
  font-size: 12.5px;
  padding: 10px 12px;
  border-bottom: 2px solid var(--line);
  background: #F8FAFC;
  white-space: nowrap;
}
td { padding: 11px 12px; border-bottom: 1px solid #EDF2F7; vertical-align: middle; }
tr.row { cursor: pointer; transition: background 0.1s; }
tr.row:hover td { background: #F8FAFC; }
td.r, th.r { text-align: right; }
td.c, th.c { text-align: center; }

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: 9999px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.b-ok { background: var(--ok-light); color: var(--ok); border: 1px solid #BBF7D0; }
.b-bad { background: var(--bad-light); color: var(--bad); border: 1px solid #FECACA; }
.b-warn { background: var(--warn-light); color: var(--warn); border: 1px solid #FDE68A; }
.b-info { background: var(--info-light); color: var(--info); border: 1px solid #BAE6FD; }
.b-n { background: #F1F5F9; color: var(--mut); border: 1px solid var(--line); }

/* Progress bar */
.bar-wrap { display: flex; align-items: center; gap: 8px; }
.bar { flex: 1; height: 7px; background: #E2E8F0; border-radius: 99px; overflow: hidden; min-width: 60px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #3B82F6, #1E40AF); border-radius: 99px; }
.bar.green i { background: linear-gradient(90deg, #22C55E, #16A34A); }

.tools { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.tools > * { width: auto; flex: 1; min-width: 170px; }
.tools > label { margin: 0; flex: 1; }

.note {
  background: #FFF;
  border: 1px solid var(--line);
  border-left: 4px solid var(--warn);
  padding: 12px 16px;
  border-radius: var(--radius);
  margin-bottom: 20px;
  font-size: 13.5px;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  box-shadow: var(--shadow-sm);
}
.note.info { border-left-color: #3B82F6; background: #F8FAFC; }
.note.success { border-left-color: var(--ok); background: #F0FDF4; }

/* Modal */
.ov {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(2px);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 30px 14px;
  overflow: auto;
  z-index: 100;
}
.mod {
  background: #fff;
  border-radius: 12px;
  padding: 24px;
  width: 100%;
  max-width: 520px;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
  border: 1px solid var(--line);
}
.mod h2 { margin-top: 0; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.mod .btns { justify-content: flex-end; margin-top: 18px; }

/* Radio / Segment buttons */
.seg-group { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.seg { display: inline-block; position: relative; margin: 0; }
.seg input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.seg span {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 6px 12px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  font-size: 13px;
  color: var(--ink);
  background: #fff;
  cursor: pointer;
  user-select: none;
}
.seg input:checked + span {
  background: var(--ac);
  border-color: var(--ac);
  color: #fff;
  font-weight: 600;
}
.seg.p input:checked + span { background: var(--ok); border-color: var(--ok); color: #fff; }
.seg.a input:checked + span { background: var(--bad); border-color: var(--bad); color: #fff; }
.seg.e input:checked + span { background: var(--warn); border-color: var(--warn); color: #fff; }

/* Attendance grid */
.gt table { width: auto; min-width: 100%; }
.gt th, .gt td { padding: 6px 4px; text-align: center; }
.gt th:first-child, .gt td:first-child {
  position: sticky;
  left: 0;
  background: #fff;
  z-index: 2;
  text-align: left;
  min-width: 160px;
  padding-left: 12px;
  box-shadow: 2px 0 4px -2px rgba(0,0,0,0.1);
}
.gt tr.sum td { background: #F8FAFC; font-weight: 700; font-size: 13px; }
.dc { min-width: 38px; }
.dc a { font-weight: 700; color: var(--ink) !important; text-decoration: none; line-height: 1.2; display: block; }
.dc small { font-weight: 500; font-size: 11px; }
.dc.tdy { background: #DBEAFE; }
.dc.wkn { background: #F1F5F9; }
.al { font-size: 12px; color: var(--ok) !important; text-decoration: none; display: inline-block; margin-top: 2px; }

.cell {
  width: 32px;
  height: 32px;
  padding: 0;
  border-radius: 6px;
  border: 1px solid var(--line-strong);
  background: #fff;
  color: #94A3B8;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
  transition: all 0.1s;
}
.cell:hover { background: #F1F5F9; border-color: #94A3B8; }
.cell.v-p { background: #22C55E; border-color: #16A34A; color: #fff; }
.cell.v-a { background: #EF4444; border-color: #DC2626; color: #fff; }
.cell.v-e { background: #F59E0B; border-color: #D97706; color: #fff; }

/* Diary week cards */
.wk { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-top: 14px; }
.dy {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 180px;
  box-shadow: var(--shadow-sm);
}
.dy.ls { border-top: 4px solid var(--ac); }
.dy.off { background: #F8FAFC; color: var(--mut); opacity: 0.85; }
.dy.tn { box-shadow: 0 0 0 2px #3B82F6; }
.dh { display: flex; justify-content: space-between; font-size: 13px; color: var(--mut); border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.dh b { color: var(--ink); font-size: 15px; }
.dy .tp { font-weight: 600; color: #0F172A; font-size: 13.5px; }
.dy button { margin-top: auto; }

/* Attendance pills & logs */
.att-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.att-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12.5px;
  font-weight: 500;
}
.att-pill.ok { background: #DCFCE7; color: #15803D; border: 1px solid #86EFAC; }
.att-pill.bad { background: #FEE2E2; color: #B91C1C; border: 1px solid #FCA5A5; }
.att-pill.warn { background: #FEF3C7; color: #B45309; border: 1px solid #FDE68A; }

/* Syllabus / Plan numbered list */
ol.syllabus { margin: 0; padding-left: 20px; counter-reset: item; }
ol.syllabus li {
  padding: 6px 0;
  border-bottom: 1px solid #F1F5F9;
  font-size: 13.5px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
ol.syllabus li.done { color: var(--mut); text-decoration: line-through; }
ol.syllabus li.active { font-weight: 700; color: var(--ac); background: #EFF6FF; padding: 6px 8px; border-radius: 6px; }

/* Mobile bottom nav */
.mobile-nav { display: none !important; }

/* Notes styles */
.notes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
  margin-top: 16px;
}
.note-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: var(--shadow-sm);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  position: relative;
  border-left: 5px solid #3B82F6;
}
.note-card:hover {
  box-shadow: var(--shadow);
  transform: translateY(-2px);
}
.note-card.note-blue { border-left-color: #3B82F6; }
.note-card.note-emerald { border-left-color: #10B981; }
.note-card.note-amber { border-left-color: #F59E0B; }
.note-card.note-rose { border-left-color: #F43F5E; }
.note-card.note-purple { border-left-color: #8B5CF6; }
.note-card.note-slate { border-left-color: #64748B; }

.note-card.pinned {
  background: #F8FAFC;
  border-color: #CBD5E1;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.note-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 8px;
}
.note-title {
  font-size: 16px;
  font-weight: 700;
  color: #0F172A;
  margin: 0 0 6px;
  line-height: 1.35;
}
.note-body {
  color: #334155;
  font-size: 13.5px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
  flex: 1;
  margin-bottom: 14px;
}
.note-meta {
  font-size: 11.5px;
  color: var(--mut);
  border-top: 1px solid #F1F5F9;
  padding-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.note-actions {
  display: flex;
  gap: 6px;
  align-items: center;
}
.pill-filter {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 12px 0;
}
.pill-btn {
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--line-strong);
  background: #fff;
  color: #334155;
  font-size: 12.5px;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.15s ease;
}
.pill-btn:hover {
  background: var(--ac-light);
  border-color: var(--ac);
  color: var(--ac);
}
.pill-btn.on {
  background: var(--ac);
  color: #fff;
  border-color: var(--ac);
}

/* Responsive Top Navigation (Netlify emblemasi pastda to'sib qo'ymasligi uchun menyu yuqorida chiqadi) */
@media (max-width: 900px) {
  .shell { display: block; padding-bottom: 20px; }
  aside {
    position: sticky;
    top: 0;
    z-index: 100;
    width: 100%;
    height: auto;
    background: #0F172A;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
    display: flex;
    flex-direction: column;
  }
  .brand {
    border: 0;
    padding: 10px 14px 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }
  .brand .brand-title {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand .brand-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  nav {
    display: flex;
    overflow-x: auto;
    flex-wrap: nowrap;
    width: 100%;
    padding: 6px 12px 10px;
    gap: 6px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  nav::-webkit-scrollbar { display: none; }
  nav a {
    white-space: nowrap;
    margin: 0;
    padding: 6px 13px;
    font-size: 13px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.08);
    color: #E2E8F0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex: 0 0 auto;
    text-decoration: none;
  }
  nav a:hover {
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
  }
  nav a.on {
    background: #38BDF8;
    color: #0F172A;
    font-weight: 700;
    box-shadow: 0 2px 8px rgba(56, 189, 248, 0.35);
  }
  .side-foot { display: none; }
  main { padding: 16px 12px 30px; }
  .stats { grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid2, .grid3 { grid-template-columns: 1fr; gap: 14px; }
  .mobile-nav { display: none !important; }
}

@media print {
  aside, .mobile-nav, .noprint, .tools, .note, button, .btns { display: none !important; }
  .shell { display: block; }
  main { padding: 0; max-width: none; }
  .cell { border: 0; }
  .card { border: 0; box-shadow: none; padding: 0; margin-bottom: 20px; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const app = $('#app');
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const p2 = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
const today = () => ymd(new Date());
const now = () => { const d = new Date(); return today() + 'T' + p2(d.getHours()) + ':' + p2(d.getMinutes()); };
const month = () => today().slice(0, 7);
const fmt = n => Number(n || 0).toLocaleString('ru-RU') + " so'm";
const fdate = d => d ? d.split('-').reverse().join('.') : '';
const fmonth = m => m ? m.split('-').reverse().join('.') : '';

function hash(s) {
  let a = 0xdeadbeef, b = 0x41c6ce57;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    a = Math.imul(a ^ c, 2654435761);
    b = Math.imul(b ^ c, 1597334677);
  }
  a = Math.imul(a ^ a >>> 16, 2246822507) ^ Math.imul(b ^ b >>> 13, 3266489909);
  b = Math.imul(b ^ b >>> 16, 2246822507) ^ Math.imul(a ^ a >>> 13, 3266489909);
  return (4294967296 * (2097151 & b) + (a >>> 0)).toString(36);
}

/* ---------- IndexedDB ---------- */
const idb = () => new Promise((ok, no) => {
  const r = indexedDB.open('markaz_v2', 2);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => ok(r.result);
  r.onerror = () => no(r.error);
});
const kv = async (m, k, v) => {
  const d = await idb();
  return new Promise((ok, no) => {
    const s = d.transaction('kv', m === 'get' ? 'readonly' : 'readwrite').objectStore('kv');
    const q = m === 'get' ? s.get(k) : m === 'del' ? s.delete(k) : s.put(v, k);
    q.onsuccess = () => ok(q.result);
    q.onerror = () => no(q.error);
  });
};

function setStatus(t, sync) {
  status = t;

  const e = $('#st'), se = $('#sync-dot'), stext = $('#sync-text');
  if (e) e.textContent = t;
  if (se && stext) {
    se.className = 'sync-dot ' + (syncStatus === 'ok' ? 'green' : syncStatus === 'syncing' ? 'yellow' : syncStatus === 'err' ? 'red' : '');
    stext.textContent = syncStatus === 'ok' ? 'Bulut: Sinxronlangan' : syncStatus === 'syncing' ? 'Bulut: Saqlanmoqda...' : syncStatus === 'err' ? 'Bulut: Xatolik' : 'Bulut: Lokal rejim';
  }
}

function save() {
  S.updatedAt = new Date().toISOString();
  kv('put', 'data', S).catch(() => {});

async function doSave() {
  if (!handle) {
    setStatus('Lokal xotirada saqlandi: ' + now().slice(11), syncStatus);
    return;
  }
  if (needPerm) {
    setStatus("Faylga yozish uchun ruxsat kerak.", syncStatus);
    return;
  }
  try {
    const w = await handle.createWritable();
    await w.write(JSON.stringify(S, null, 1));
    await w.close();
    setStatus("Faylga saqlandi: " + now().slice(11), syncStatus);
  } catch (e) {
    setStatus("Faylga yozib bolmadi.", syncStatus);
  }
}

/* ---------- GitHub Cloud Sync API ---------- */
async function cloudPush(isAuto) {
  const gh = S.settings?.github;
  if (!gh || !gh.token || !gh.gistId) {
    if (!isAuto) alert("GitHub Token yoki Gist ID kiritilmagan. Sozlamalar bo'limida kiriting.");
    return false;
  }
  setStatus('GitHub-ga yuborilmoqda...', 'syncing');
  try {
    const res = await fetch(`https://api.github.com/gists/${gh.gistId}`, {
      method: 'PATCH',
      headers: {
        'Accept': 'application/vnd.github.v3+json',
        'Authorization': 'token ' + gh.token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        description: "O'quv markaz nazorat jurnali - " + new Date().toLocaleString(),
        files: {
          'markaz_data.json': {
            content: JSON.stringify(S, null, 2)
          }
        }
      })
    });
    if (!res.ok) throw new Error('Status: ' + res.status);
    gh.lastSync = new Date().toISOString();
    setStatus('GitHub-ga yuklandi: ' + now().slice(11), 'ok');
    if (!isAuto) alert("Ma'lumotlar GitHub bulutiga muvaffaqiyatli yuklandi!");
    render();
    return true;
  } catch (e) {
    console.error(e);
    setStatus('GitHub-ga yuklashda xatolik!', 'err');
    if (!isAuto) alert("GitHub-ga yuklashda xatolik: Token yoki Internetni tekshiring.");
    return false;
  }
}

async function cloudPull(isAuto) {
  const gh = S.settings?.github;
  if (!gh || !gh.token || !gh.gistId) {
    if (!isAuto) alert("GitHub Token yoki Gist ID kiritilmagan.");
    return false;
  }
  setStatus('GitHub-dan yuklanmoqda...', 'syncing');
  try {
    const res = await fetch(`https://api.github.com/gists/${gh.gistId}`, {
      headers: {
        'Accept': 'application/vnd.github.v3+json',
        'Authorization': 'token ' + gh.token
      }
    });
    if (!res.ok) throw new Error('Status: ' + res.status);
    const json = await res.json();
    const file = json.files && json.files['markaz_data.json'];
    if (!file || !file.content) throw new Error('Gist ichida markaz_data.json topilmadi');
    const cloudData = JSON.parse(file.content);
    
    if (!cloudData.groups || !cloudData.students) throw new Error("Ma'lumot formati noto'g'ri");
    
    if (!isAuto && S.updatedAt && cloudData.updatedAt && S.updatedAt > cloudData.updatedAt) {
      if (!confirm("Diqqat! Kompyuteringizdagi lokal ma'lumot GitHub-dagidan ko'ra yangiroq. Baribir GitHub-dagi bilan almashtirilsinmi?")) {
        setStatus('Sinxronlash bekor qilindi', 'ok');
        return false;
      }
    }
    
    S = cloudData;
    S.settings.github = gh;
    gh.lastSync = new Date().toISOString();
    kv('put', 'data', S).catch(() => {});
    setStatus('GitHub-dan yangilandi: ' + now().slice(11), 'ok');
    if (!isAuto) alert("Ma'lumotlar GitHub bulutidan muvaffaqiyatli yuklandi!");
    render();
    return true;
  } catch (e) {
    console.error(e);
    setStatus('GitHub-dan yuklashda xatolik!', 'err');
    if (!isAuto) alert("GitHub-dan yuklashda xatolik yuz berdi. Internet va tokenni tekshiring.");
    return false;
  }
}

async function cloudCreateGist() {
  const gh = S.settings?.github;
  if (!gh || !gh.token) {
    alert("Avval GitHub Personal Access Token (PAT) kiriting!");
    return;
  }
  setStatus('Gist yaratilmoqda...', 'syncing');
  try {
    const res = await fetch('https://api.github.com/gists', {
      method: 'POST',
      headers: {
        'Accept': 'application/vnd.github.v3+json',
        'Authorization': 'token ' + gh.token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        description: "O'quv markaz nazorat jurnali - Baza",
        public: false,
        files: {
          'markaz_data.json': {
            content: JSON.stringify(S, null, 2)
          }
        }
      })
    });
    if (!res.ok) throw new Error('Status: ' + res.status);
    const json = await res.json();
    gh.gistId = json.id;
    gh.lastSync = new Date().toISOString();
    save();
    setStatus('Gist yaratildi va ulandi!', 'ok');
    alert("GitHub-da yangi maxfiy ombor (Gist) yaratildi! ID: " + json.id);
    render();
  } catch (e) {
    console.error(e);
    setStatus('Gist yaratishda xatolik!', 'err');
    alert("Gist yaratib bo'lmadi. Token huquqlarida 'gist' belgisi borligini tekshiring.");
  }
}

const period = g => (g.start || gEnd(g)) ? `${g.start ? fdate(g.start) : '?'} - ${gEnd(g) ? fdate(gEnd(g)) : 'muddatsiz'}` : '<small>Kiritilmagan</small>';

const gopts = (sel, all) => {
  const o = g => `<option value="${g.id}" ${g.id === sel ? 'selected' : ''}>${esc(g.name)} (${COURSE_LABELS[g.cat] || 'Kurs'})</option>`;
  const a = S.groups.filter(g => !gArch(g)), r = S.groups.filter(g => gArch(g));
  return (all ? `<option value="all" ${sel === 'all' ? 'selected' : ''}>Barcha guruhlar</option>` : '') + a.map(o).join('') + (r.length ? `<optgroup label="Arxiv (yopilgan guruhlar)">${r.map(o).join('')}</optgroup>` : '');
};

const feeOf = s => {
  if (s.fee != null && s.fee !== '') return Number(s.fee);
  const grp = G(s.g);
  if (s.rateType && S.settings?.rates?.[s.rateType]) {
    return Number(S.settings.rates[s.rateType].fee || 0);
  }
  return Number(grp?.fee || 0);
};

const isExempt = (s, m) => s.payMode === 'exempt' || (s.monthStatus && s.monthStatus[m] === 'exempt');
const isPrepaid = (s, m) => s.payMode === 'prepaid' || (s.monthStatus && s.monthStatus[m] === 'prepaid');

const paid = (sid, m) => S.payments.filter(p => p.s === sid && p.m === m).reduce((a, p) => a + Number(p.amt || 0), 0);

const expectedOf = (s, m) => {
  if (!act(s, m)) return 0;
  if (isExempt(s, m)) return 0;
  if (isPrepaid(s, m)) return 0;
  return feeOf(s);
};

const owes = (s, m) => {
  if (!act(s, m)) return 0;
  if (isExempt(s, m)) return 0;
  if (isPrepaid(s, m)) return 0;
  return Math.max(0, feeOf(s) - paid(s.id, m));
};

const payBadge = (s, m) => {
  if (isExempt(s, m)) return "<span class='badge b-info'>To'lovdan ozod (Grant)</span>";
  if (isPrepaid(s, m)) return "<span class='badge b-ok'>Oldindan to'langan</span>";
  const f = feeOf(s), p = paid(s.id, m);
  if (!act(s, m) && !p) return "<span class='badge b-n'>Faol emas</span>";
  if (!f) return "<span class='badge b-n'>Belgilanmagan</span>";
  if (p >= f) return "<span class='badge b-ok'>To'langan</span>";
  if (p > 0) return "<span class='badge b-warn'>Qisman</span>";
  return "<span class='badge b-bad'>To'lanmagan</span>";
};

const lessonsOf = gid => S.lessons.filter(l => l.g === gid).sort((a, b) => b.date.localeCompare(a.date));
const isTopicDone = (g, topic) => S.lessons.some(l => l.g === g.id && l.topic.trim().toLowerCase() === topic.trim().toLowerCase());

function getTopicStats(g) {
  const plan = g.plan || [];
  const total = plan.length;
  const covered = plan.filter(t => isTopicDone(g, t)).length;
  const remaining = total - covered;
  const pct = total ? Math.round((covered / total) * 100) : 0;
  const next = plan.find(t => !isTopicDone(g, t)) || (total ? "Barcha mavzular o'tildi" : "Reja kiritilmagan");
  const last = lessonsOf(g.id)[0];
  return { total, covered, remaining, pct, next, last };
}

const attBadge = v => v === 'p' ? '<span class="badge b-ok">Keldi</span>' : v === 'a' ? '<span class="badge b-bad">Kelmadi</span>' : v === 'e' ? '<span class="badge b-warn">Sababli</span>' : '';

function attStat(s) {
  const l = S.lessons.filter(x => x.g === s.g && x.att && x.att[s.id]);
  const p = l.filter(x => x.att[s.id] === 'p').length;
  const a = l.filter(x => x.att[s.id] === 'a').length;
  const e = l.filter(x => x.att[s.id] === 'e').length;
  return { t: l.length, p, a, e, pct: l.length ? Math.round(p / l.length * 100) : null, lessons: l };
}

function calcSalary(m) {
  let totalCollected = 0;
  let totalTeacherEarned = 0;
  let totalExpected = 0;
  let totalTeacherExpected = 0;

  const groupBreakdown = S.groups.map(g => {
    const st = S.students.filter(s => s.g === g.id && (act(s, m) || paid(s.id, m) > 0));
    const grpPaid = st.reduce((a, s) => a + paid(s.id, m), 0);
    const grpExp = st.reduce((a, s) => a + expectedOf(s, m), 0);
    const pct = g.teacherPercent != null ? g.teacherPercent : (S.settings?.rates?.[g.cat]?.teacherPercent ?? S.settings?.teacherBasePercent ?? 50);
    const teacherEarned = Math.round(grpPaid * (pct / 100));
    const teacherExp = Math.round(grpExp * (pct / 100));

    totalCollected += grpPaid;
    totalTeacherEarned += teacherEarned;
    totalExpected += grpExp;
    totalTeacherExpected += teacherExp;

    return {
      group: g,
      stCount: st.length,
      paidCount: st.filter(s => paid(s.id, m) >= feeOf(s) || isPrepaid(s, m)).length,
      debtCount: st.filter(s => owes(s, m) > 0).length,
      exemptCount: st.filter(s => isExempt(s, m)).length,
      grpPaid,
      grpExp,
      pct,
      teacherEarned,
      teacherExp,
      lostSalary: teacherExp - teacherEarned
    };
  });

  const advances = (S.salaries || []).filter(sal => sal.m === m).reduce((a, sal) => a + Number(sal.amt || 0), 0);
  const remainingToReceive = totalTeacherEarned - advances;

  return {
    month: m,
    totalCollected,
    totalTeacherEarned,
    totalExpected,
    totalTeacherExpected,
    lostSalary: totalTeacherExpected - totalTeacherEarned,
    advances,
    remainingToReceive,
    groupBreakdown
  };
}

const stat = (t, n, sub, cls = '') => `<div class="stat ${cls}"><b>${n}</b><span>${t}</span>${sub ? `<small class="sub">${sub}</small>` : ''}</div>`;
const tbl = (h, rows, empty) => rows.length ? `<div class="tw"><table><thead><tr>${h.map(x => `<th class="${x[1] || ''}">${x[0]}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>` : `<p class="mut" style="padding:14px 0">${empty}</p>`;

function modal(title, fields, vals, ok) {
  const el = document.createElement('div');
  el.className = 'ov';
  const fld = f => {
    if (f.t === 'chk') {
      return `<div style="margin-bottom:14px"><span class="mut" style="font-size:13.5px;font-weight:600">${f.l}</span><div class="seg-group">${DAYS.map((d, i) => `<label class="seg"><input type="checkbox" name="${f.n}" value="${i}" ${(vals[f.n] || []).includes(i) ? 'checked' : ''}><span>${d}</span></label>`).join('')}</div></div>`;
    }
    if (f.t === 'sel') {
      return `<label>${f.l}${f.desc ? `<span class="desc">${f.desc}</span>` : ''}<select name="${f.n}" id="${f.id || ''}">${f.o.map(o => `<option value="${o[0]}" ${o[0] === vals[f.n] ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select></label>`;
    }
    if (f.t === 'ta') {
      return `<label>${f.l}${f.desc ? `<span class="desc">${f.desc}</span>` : ''}<textarea name="${f.n}" id="${f.id || ''}" rows="${f.r || 4}" placeholder="${f.p || ''}">${esc(vals[f.n])}</textarea></label>`;
    }
    return `<label>${f.l}${f.desc ? `<span class="desc">${f.desc}</span>` : ''}<input name="${f.n}" id="${f.id || ''}" type="${f.t || 'text'}" value="${esc(vals[f.n])}" ${f.req ? 'required' : ''} ${f.min != null ? 'min="' + f.min + '"' : ''} placeholder="${f.p || ''}"></label>`;
  };

  el.innerHTML = `<form class="mod"><h2>${title}</h2>${fields.map(fld).join('')}<div class="btns"><button type="button" class="ghost" data-x>Bekor qilish</button><button>Saqlash</button></div></form>`;
  document.body.appendChild(el);

  // Kurs tanlanganda mavzular rejasi va tariflarni avtomatik to'ldirish
  const catSel = el.querySelector('select[name="cat"]');
  const planTa = el.querySelector('textarea[name="plan"]');
  const feeInp = el.querySelector('input[name="fee"]');
  const pctInp = el.querySelector('input[name="teacherPercent"]');
  if (catSel && planTa) {
    catSel.addEventListener('change', () => {
      const selectedCat = catSel.value;
      const catPlan = getCoursePlan(selectedCat);
      planTa.value = catPlan.join('\n');
      if (feeInp && S.settings?.rates?.[selectedCat]?.fee != null) {
        feeInp.value = S.settings.rates[selectedCat].fee;
      }
      if (pctInp && S.settings?.rates?.[selectedCat]?.teacherPercent != null) {
        pctInp.value = S.settings.rates[selectedCat].teacherPercent;
      }
    });
  }

  const firstInput = el.querySelector('input:not([type="checkbox"]), select, textarea');
  if (firstInput) firstInput.focus();

  el.onclick = e => { if (e.target === el || e.target.dataset.x !== undefined) el.remove(); };
  el.querySelector('form').onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(e.target), o = Object.fromEntries(fd);
    fields.filter(f => f.t === 'chk').forEach(f => o[f.n] = fd.getAll(f.n));
    ok(o);
    el.remove();
  };
}

function comments(k, r) {
  const c = (S.comments || []).filter(x => x.k === k && x.r === r).sort((a, b) => b.at.localeCompare(a.at));
  return `<div class="cm" style="margin-top:12px">${c.map(x => `<div style="border-bottom:1px solid #E2E8F0;padding:8px 0"><div>${esc(x.t).replace(/\n/g, '<br>')}</div><small style="display:flex;gap:12px;margin-top:3px">${fdate(x.at.slice(0, 10))} ${x.at.slice(11, 16)} <a data-act="delc" data-id="${x.id}">O'chirish</a></small></div>`).join('') || '<p class="mut">Izohlar yoq.</p>'}

}

/* 4. O'quvchilar ro'yxati va monitoringi */
const stuRows = () => {
  const q = (ctx.q || '').toLowerCase();
  const f = ctx.f || '';
  const scat = ctx.scat || '';
  const m = month();
  const sf = ctx.ss || 'act';
  const r = S.students.filter(s => {
    if (f && s.g !== f) return false;
    if (scat) {
      const g = G(s.g);
      const cCat = g?.cat || s.rateType;
      if (cCat !== scat) return false;
    }
    if (q && !s.name.toLowerCase().includes(q) && !(s.phone || '').toLowerCase().includes(q)) return false;
    if (sf === 'arch') return sArch(s);
    if (sf === 'act') return !sArch(s);
    return true; // all
  }).sort((a, b) => a.name.localeCompare(b.name));

  return tbl([['Ism va Telefon'], ['Guruh / Yo\'nalish'], ['Tarif / Oylik'], ['Davomat'], ["Shu oy to'lovi"], ['Holat']], r.map(s => {
    const a = attStat(s);
    const grp = G(s.g);
    return `<tr class="row" data-act="ops" data-id="${s.id}">
      <td><b>${esc(s.name)}</b>${s.phone ? `<br><small>${esc(s.phone)}</small>` : ''}</td>

function students() {
  const sf = ctx.ss || 'act';
  const m = month();
  const allS = S.students || [];

  // Jami va o'qiyotganlar statistikasi
  const totalStudents = allS.length;
  const studyingStudents = allS.filter(s => !sArch(s));
  const studyingCount = studyingStudents.length;

  // Ketgan va bitirganlar
  const thisMonthLeft = allS.filter(s => s.out && s.out.slice(0, 7) === m && s.outT !== 'grad');
  const thisMonthGrad = allS.filter(s => s.out && s.out.slice(0, 7) === m && s.outT === 'grad');

  const totalLeft = allS.filter(s => s.out && s.outT !== 'grad');
  const totalGrad = allS.filter(s => s.out && s.outT === 'grad');
  const totalOut = allS.filter(s => s.out);

  // Kurslar turlari bo'yicha tahliliy hisob-kitob
  const definedCats = ['komp', 'it_foundation', 'it_frontend', 'it_backend', 'indiv'];
  const allCats = Array.from(new Set([...definedCats, ...S.groups.map(g => g.cat).filter(Boolean)]));

  const courseAnalysis = allCats.map(cat => {
    const name = COURSE_LABELS[cat] || S.settings?.rates?.[cat]?.name || cat;
    const inCourse = allS.filter(s => {
      const g = G(s.g);
      return (g && g.cat === cat) || (!g && s.rateType === cat);
    });
    const cTotal = inCourse.length;
    const cStudying = inCourse.filter(s => !sArch(s)).length;
    const cMonthLeft = inCourse.filter(s => s.out && s.out.slice(0, 7) === m && s.outT !== 'grad').length;
    const cMonthGrad = inCourse.filter(s => s.out && s.out.slice(0, 7) === m && s.outT === 'grad').length;
    const cTotalLeft = inCourse.filter(s => s.out && s.outT !== 'grad').length;
    const cTotalGrad = inCourse.filter(s => s.out && s.outT === 'grad').length;
    const cRetention = cTotal > 0 ? Math.round(cStudying / cTotal * 100) : 0;
    return { cat, name, total: cTotal, studying: cStudying, monthLeft: cMonthLeft, monthGrad: cMonthGrad, totalLeft: cTotalLeft, totalGrad: cTotalGrad, retention: cRetention };
  }).filter(c => c.total > 0 || S.groups.some(g => g.cat === c.cat));

  return `<div class="head">
    <div>
      <h1>MD O'quvchilar</h1>
      <p class="mut">Barcha guruhlardagi o'quvchilar ro'yxati, to'lovlari va oylik monitoringi</p>
    </div>
    <div class="btns">
      <button data-act="sform" data-g="${ctx.f || ''}">+ Yangi o'quvchi qo'shish</button>
    </div>
  </div>

  <!-- Yuqori KPI statistikalar -->
  <div class="stats" style="margin-bottom:20px">
    ${stat("Jami o'quvchilar", totalStudents + " ta", "Tizimdagi barcha ro'yxatdagilar", "blue")}
    ${stat("O'qiyotgan jami o'quvchilar", studyingCount + " ta", "Hozirda faol ta'lim olayotganlar", "green")}
    ${stat("Bu oy ketgan o'quvchilar", thisMonthLeft.length + " ta", (thisMonthGrad.length ? `+${thisMonthGrad.length} ta bitirdi | ` : "") + fmonth(m) + " oyi bo'yicha", thisMonthLeft.length > 0 ? "warn" : "green")}
    ${stat("Umumiy ketgan o'quvchilar", totalLeft.length + " ta", `Bitirganlar: ${totalGrad.length} ta | Jami: ${totalOut.length} ta`, totalLeft.length > 0 ? "bad" : "green")}
  </div>

  <!-- Kurslar turlariga qarab tahlil bloki -->
  <div class="card" style="margin-bottom:20px">
    <div class="head" style="margin-bottom:12px">
      <div>
        <h2>B Kurslar turlari bo'yicha o'quvchilar monitoringi</h2>
        <p class="mut">Har bir kurs yo'nalishidagi o'qiyotgan, bu oy ketgan, umumiy ketgan va bitirgan o'quvchilar tahlili</p>
      </div>
    </div>
    ${tbl([
      ["Kurs / Yo'nalish"],
      ["O'qiyotgan jami", "c"],
      ["Bu oy ketgan", "c"],
      ["Umumiy ketgan", "c"],
      ["Bitirgan", "c"],
      ["Kursdagi jami", "c"],
      ["Faollik / Saqlanish darajasi"]
    ], courseAnalysis.map(c => `<tr>
      <td><b>${esc(c.name)}</b></td>
      <td class="c"><span class="badge b-ok" style="font-weight:700">${c.studying} ta</span></td>
      <td class="c">${c.monthLeft > 0 ? `<span class="badge b-bad">${c.monthLeft} ta</span>` : `<span class="badge b-n">0</span>`}${c.monthGrad > 0 ? `<br><small class="mut">+${c.monthGrad} bitirgan</small>` : ''}</td>
      <td class="c">${c.totalLeft > 0 ? `<span class="badge b-bad">${c.totalLeft} ta</span>` : `<span class="badge b-n">0</span>`}</td>
      <td class="c">${c.totalGrad > 0 ? `<span class="badge b-info">${c.totalGrad} ta</span>` : `<span class="badge b-n">0</span>`}</td>
      <td class="c"><b>${c.total} ta</b></td>
      <td>
        <div class="bar-wrap">
          <div class="bar"><i style="width:${c.retention}%"></i></div>
          <small><b>${c.retention}%</b> faol (${c.studying}/${c.total})</small>
        </div>
      </td>
    </tr>`), "Hozircha kurslar mavjud emas.")}
  </div>

  <!-- O'quvchilar ro'yxati -->
  <div class="card">
    <div class="head" style="margin-bottom:12px">
      <div>
        <h2>O'quvchilar ro'yxati</h2>
        <p class="mut">Qidirish, kurs toifasi va guruhlar bo'yicha saralash</p>
      </div>
    </div>
    <div class="tools">
      <input id="sq" placeholder="Ism yoki telefon bo'yicha qidirish..." value="${esc(ctx.q || '')}">
      <select data-chg="ss">
        <option value="act" ${sf === 'act' ? 'selected' : ''}>Faol o'quvchilar</option>
        <option value="arch" ${sf === 'arch' ? 'selected' : ''}>Arxiv (bitirgan va ketgan)</option>
        <option value="all" ${sf === 'all' ? 'selected' : ''}>Barcha o'quvchilar</option>
      </select>
      <select data-chg="scat">
        <option value="">Barcha kurs turlari</option>
        ${allCats.map(cat => `<option value="${cat}" ${ctx.scat === cat ? 'selected' : ''}>${esc(COURSE_LABELS[cat] || S.settings?.rates?.[cat]?.name || cat)}</option>`).join('')}
      </select>
      <select data-chg="sf">
        <option value="">Barcha guruhlar</option>
        ${gopts(ctx.f || '')}
      </select>
    </div>
    <div id="stbl">${stuRows()}</div>
  </div>`;
}

/* 8. Oylik davomat */
const amode = () => {
  const g = G(ctx.ag);
  const m = ctx.ak || (g && g.start ? 'course' : 'cal');
  return m === 'course' && !(g && g.start) ? 'cal' : m;
};

function attView() {
  if (!S.groups.length) return `<h1>Oylik davomat</h1><div class="card"><p class="mut">Avval guruh yarating.</p></div>`;
  if (!G(ctx.ag)) { ctx.ag = defG(); ctx.ac = null; }
  const g = G(ctx.ag), td = today(), eff = gEnd(g), mode = amode();
  ctx.am = ctx.am || month();

  let from, to, prevOff = false, nextOff = false, plabel = '';
  if (mode === 'course') {
    if (ctx.ac == null) {
      let k = 0;
      while (addM(g.start, k + 1) <= td && (!eff || addM(g.start, k + 1) <= eff)) k++;
      ctx.ac = k;
    }
    from = addM(g.start, ctx.ac);
    to = addD(addM(g.start, ctx.ac + 1), -1);
    prevOff = ctx.ac <= 0;
    nextOff = !!eff && addM(g.start, ctx.ac + 1) > eff;
    plabel = (ctx.ac + 1) + "-oy: " + fdate(from) + " - " + fdate(to);
  } else {
    const m = ctx.am;
    from = m + '-01';
    to = m + '-' + p2(new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate());
    plabel = fdate(from) + " - " + fdate(to);
  }

  const L = {}, sym = { p: '✓', a: '✗', e: 'S' };
  S.lessons.filter(l => l.g === g.id && l.date >= from && l.date <= to).forEach(l => L[l.date] = l);
  const st = S.students.filter(s => s.g === g.id && (!s.out || s.out >= from)).sort((a, b) => a.name.localeCompare(b.name));
  const ds = [];
  for (let dt = from; dt <= to; dt = addD(dt, 1)) {
    if (L[dt] || (inSpan(g, dt) && (!(g.days || []).length || g.days.includes(wd(dt))))) ds.push(dt);
  }

  const head = `<tr><th>O'quvchi</th>${ds.map(dt => `<th class="dc${dt === td ? ' tdy' : ''}${wd(dt) > 4 ? ' wkn' : ''}"><a data-act="day" data-id="${dt}" title="${esc(L[dt] && L[dt].topic || 'Mavzu kiritilmagan')}">${+dt.slice(8)}<br><small>${DAYS[wd(dt)]}</small></a><a data-act="allday" data-id="${dt}" class="al" title="Hammasi keldi">${L[dt] && L[dt].topic ? '●' : '✓'}</a></th>`).join('')}<th>Keldi</th><th>Kelmadi</th><th>Sababli</th><th>%</th></tr>`;

  const rows = st.map(s => {
    let p = 0, a = 0, e = 0;
    const cells = ds.map(dt => {
      const v = (L[dt] && L[dt].att && L[dt].att[s.id]) || '';
      if (v === 'p') p++; else if (v === 'a') a++; else if (v === 'e') e++;
      return `<td><button type="button" class="cell ${v ? 'v-' + v : ''}" data-act="cell" data-id="${s.id}" data-d="${dt}" title="${fdate(dt)}">${sym[v] || '·'}</button></td>`;
    }).join('');
    const t = p + a + e;
    return `<tr><td><a data-act="ops" data-id="${s.id}"><b>${esc(s.name)}</b></a>${s.out ? ' <small>(' + sState(s)[0].toLowerCase() + ')</small>' : ''}</td>${cells}<td>${p}</td><td>${a}</td><td>${e}</td><td><b>${t ? Math.round(p / t * 100) + '%' : '-'}</b></td></tr>`;
  }).join('');

  const sum = `<tr class="sum"><td>Jami kelganlar</td>${ds.map(dt => `<td>${st.filter(s => L[dt] && L[dt].att && L[dt].att[s.id] === 'p').length || ''}</td>`).join('')}<td colspan="4"></td></tr>`;

  return `<div class="head">
    <div>
      <h1>Oylik davomat jurnali</h1>
      <p class="mut">Katakchani bosing: <b>✓</b> keldi, <b>✗</b> kelmadi, <b>S</b> sababli. Kun raqamini bossangiz dars mavzusi ochiladi.</p>
    </div>
    <button class="ghost noprint" onclick="window.print()"> Chop etish</button>
  </div>

  <div class="card">
    <div class="tools">
      <label>Guruh
        <select data-chg="ag">${gopts(g.id)}</select>
      </label>
      <label>Ko'rinish rejimi
        <select data-chg="ak">
          <option value="course" ${mode === 'course' ? 'selected' : ''} ${g.start ? '' : 'disabled'}>Kurs oyi (boshlangan sanadan 1 oy)</option>
          <option value="cal" ${mode === 'cal' ? 'selected' : ''}>Taqvim oyi</option>
        </select>
      </label>
      ${mode === 'cal' ? `<label>Oy<input type="month" data-chg="am" value="${ctx.am}"></label>` : ''}
    </div>

    <div style="display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
      <button class="ghost sm" data-act="mm" data-id="-1" ${prevOff ? 'disabled' : ''}>&larr; Oldingi davr</button>
      <b>${plabel}</b>
      <button class="ghost sm" data-act="mm" data-id="1" ${nextOff ? 'disabled' : ''}>Keyingi davr &rarr;</button>
    </div>

    <div class="leg" style="display:flex;gap:12px;font-size:12.5px;margin-bottom:14px;flex-wrap:wrap">
      <span class="badge b-ok">✓ Keldi</span>
      <span class="badge b-bad">✗ Kelmadi</span>
      <span class="badge b-warn">S Sababli</span>
      <span>● Mavzu kiritilgan</span>
    </div>

    ${st.length ? `<div class="tw gt"><table><thead>${head}</thead><tbody>${rows}${sum}</tbody></table></div>` : "<p class='mut'>Bu davrda o'quvchilar yo'q.</p>"}
  </div>`;
}

function diaryView() {

  const top = getTopicStats(g);

  const cards = [0, 1, 2, 3, 4, 5, 6].map(i => {
    const dt = addD(ctx.dw, i), l = S.lessons.find(x => x.g === g.id && x.date === dt);

/* 13. Qaydnoma (Notes / Eslatmalar) */
function notesView() {
  const notes = S.notes || [];
  const q = (ctx.noteQ || '').toLowerCase();
  const catFilter = ctx.noteCat || 'all';

  const categories = ['all', 'Umumiy', 'Darslar', "O'quvchilar", 'Guruhlar', 'Moliyaviy', 'Muhim vazifalar'];

  let filtered = notes.filter(n => {
    if (catFilter !== 'all' && n.category !== catFilter) return false;
    if (q) {
      const matchTitle = (n.title || '').toLowerCase().includes(q);
      const matchContent = (n.content || '').toLowerCase().includes(q);
      if (!matchTitle && !matchContent) return false;
    }
    return true;
  });

  // Pinned birinchi, so'ngra updatedAt yoki createdAt bo'yicha saralash
  filtered.sort((a, b) => {
    if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    const timeA = a.updatedAt || a.createdAt || '';
    const timeB = b.updatedAt || b.createdAt || '';
    return timeB.localeCompare(timeA);
  });

  const pinnedCount = notes.filter(n => n.pinned).length;

  return `<div class="head">
    <div>
      <h1>Q Qaydnoma & Shaxsiy Eslatmalar</h1>
      <p class="mut">Darslar, o'quvchilar, guruhlar va markaz bo'yicha eslatmalar, qaydlar va muhim topshiriqlar</p>
    </div>
    <div class="btns">
      <button data-act="openAddNote">+ Yangi qayd yozish</button>
    </div>
  </div>

  <div class="card" style="margin-bottom:20px">
    <div class="tools" style="margin-bottom:12px">
      <input id="noteSearchInp" placeholder="Qaydlardan qidirish (sarlavha yoki matn)..." value="${esc(ctx.noteQ || '')}">
      <select data-chg="noteCat">
        <option value="all" ${catFilter === 'all' ? 'selected' : ''}>Barcha toifalar (${notes.length})</option>
        <option value="Umumiy" ${catFilter === 'Umumiy' ? 'selected' : ''}>Umumiy</option>
        <option value="Darslar" ${catFilter === 'Darslar' ? 'selected' : ''}>Darslar</option>
        <option value="O'quvchilar" ${catFilter === "O'quvchilar" ? 'selected' : ''}>O'quvchilar</option>
        <option value="Guruhlar" ${catFilter === 'Guruhlar' ? 'selected' : ''}>Guruhlar</option>
        <option value="Moliyaviy" ${catFilter === 'Moliyaviy' ? 'selected' : ''}>Moliyaviy</option>
        <option value="Muhim vazifalar" ${catFilter === 'Muhim vazifalar' ? 'selected' : ''}>Muhim vazifalar</option>
      </select>
    </div>
    <div class="pill-filter" style="margin:0">
      ${categories.map(c => `<button class="pill-btn ${catFilter === c ? 'on' : ''}" data-act="setNoteCat" data-cat="${c}">${c === 'all' ? 'Barchasi (' + notes.length + ')' : c}</button>`).join('')}
    </div>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <small class="mut">Topilgan qaydlar: <b>${filtered.length} ta</b> ${pinnedCount > 0 ? `(📌 Qadalgan: ${pinnedCount} ta)` : ''}</small>
  </div>

  ${filtered.length ? `<div class="notes-grid">
    ${filtered.map(n => `
      <div class="note-card note-${n.color || 'blue'} ${n.pinned ? 'pinned' : ''}">
        <div>

        ['slate', 'Kulrang']
      ] },
      { l: 'Qayd matni', n: 'content', t: 'ta', r: 7 }
    ], { title: n.title, category: n.category || 'Umumiy', color: n.color || 'blue', content: n.content || '' }, d => {
      n.title = d.title.trim();
      n.category = d.category;
      n.color = d.color;
      n.content = d.content.trim();
      n.updatedAt = now();
      commit();
    });
  },

  delNote: id => {
    if (!confirm("Ushbu qaydni o'chirmoqchimisiz?")) return;
    S.notes = (S.notes || []).filter(x => x.id !== id);
    commit();
  },

  togglePinNote: id => {
    const n = (S.notes || []).find(x => x.id === id);
    if (n) {
      n.pinned = !n.pinned;
      commit();
    }
  },

  setNoteCat: (id, t) => {
    ctx.noteCat = t.dataset.cat;
    render();
  },

  /* Kurs mavzulari amallari */
  selSylCat: (id, t) => {
    ctx.sylCat = t.dataset.cat;
    render();
  },

  saveSylPlan: (id, t) => {
    const cat = t.dataset.cat;
    const txt = $('#sylPlanText')?.value || '';
    const lines = txt.split('\n').map(x => x.trim()).filter(Boolean);
    S.settings = S.settings || {};
    S.settings.syllabuses = S.settings.syllabuses || {};
    S.settings.syllabuses[cat] = lines;
    commit();
    alert((COURSE_LABELS[cat] || cat) + " kursi uchun " + lines.length + " ta dars mavzusi muvaffaqiyatli saqlandi! Yangi guruh yaratilganda avtomatik kiritiladi.");
  },

  resetSylPlan: (id, t) => {
    const cat = t.dataset.cat;
    if (!confirm((COURSE_LABELS[cat] || cat) + " dars mavzularini standart shablonga qaytarmoqchimisiz?")) return;
    S.settings = S.settings || {};
    S.settings.syllabuses = S.settings.syllabuses || {};
    S.settings.syllabuses[cat] = JSON.parse(JSON.stringify(SYLLABUS_PRESETS[cat] || []));
    commit();
    alert("Standart shablon tiklandi!");
  }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || !A[t.dataset.act]) return;
  e.preventDefault();
  A[t.dataset.act](t.dataset.id, t);
});

document.addEventListener('change', e => {
  const t = e.target, c = t.dataset.chg;
  if (c) {
    const m = { sf: 'f', ss: 'ss', scat: 'scat', noteCat: 'noteCat', lg: 'lg', ld: 'ld', pg: 'pg', pm: 'pm', sm: 'sm', ag: 'ag', ak: 'ak', am: 'am', dg: 'dg' }[c];
    ctx[m] = t.value;
    if (c === 'ag' || c === 'ak') ctx.ac = null;
    if (c === 'scat') {
      const tblEl = $('#stbl');
      if (tblEl) tblEl.innerHTML = stuRows();
      return;
    }
    render();
    return;
  }
  if (t.id === 'imp' && t.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d.groups) throw new Error();
        if (!confirm("Joriy barcha ma'lumotlar yuklangan fayl bilan almashtiriladi. Davom etasizmi?")) return;
        S = d;
        commit();
      } catch (x) { alert("Noto'g'ri JSON fayl!"); }
    };
    r.readAsText(t.files[0]);
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'sq') {
    ctx.q = e.target.value;
    const tblEl = $('#stbl');
    if (tblEl) tblEl.innerHTML = stuRows();
  }
  if (e.target.id === 'noteSearchInp') {
    ctx.noteQ = e.target.value;
    render();
  }
});

document.addEventListener('submit', e => {
  const f = e.target;
  if (f.id === 'lf') {
    e.preventDefault();
    const g = G(ctx.lg), fd = new FormData(f), att = {};
    S.students.filter(s => s.g === g.id).forEach(s => {
      const v = fd.get('a_' + s.id);
      if (v) att[s.id] = v;
    });
    let l = S.lessons.find(x => x.g === g.id && x.date === ctx.ld);
    const o = { topic: fd.get('topic').trim(), note: fd.get('note').trim(), att };
    if (l) Object.assign(l, o);
    else { l = { id: uid(), g: g.id, date: ctx.ld, files: [], ...o }; S.lessons.push(l); }
    commit();
    alert("Dars va davomat muvaffaqiyatli saqlandi!");
    return;
  }

  const k = f.dataset.form;
  if (!k) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f));

  if (k === 'login') {
    if (d.u.trim() === S.auth.u && hash(d.p) === S.auth.h) {
      authed = true;
      try { sessionStorage.setItem('mk', '1'); } catch (x) {}
      render();
    } else {
      $('#le').textContent = "Login yoki parol noto'g'ri! (Standart: admin4225 / pass4225)";
    }
  }

  if (k === 'cred') {
    const er = $('#ce');
    if (hash(d.old) !== S.auth.h) { er.textContent = "Joriy parol noto'g'ri."; return; }
    if (d.n1 && d.n1.length < 6) { er.textContent = "Yangi parol kamida 6 belgidan iborat bo'lsin."; return; }
    if (d.n1 !== d.n2) { er.textContent = "Yangi parollar bir-biriga mos kelmadi."; return; }
    S.auth.u = d.u.trim();
    if (d.n1) S.auth.h = hash(d.n1);
    save(); render();
    alert("Kirish ma'lumotlari yangilandi!");
  }

  if (k === 'gh_save') {
    S.settings.github.token = d.token.trim();
    S.settings.github.gistId = d.gistId.trim();
    S.settings.github.autoSync = !!d.autoSync;
    save(); render();
    alert("GitHub sozlamalari saqlandi!");
  }

  if (k === 'save_rates') {
    S.settings.rates = S.settings.rates || {};
    S.settings.rates.komp = { name: "Kompyuter savodxonligi", fee: +d.rate_komp || 250000, teacherPercent: +d.pct_komp || 50 };
    S.settings.rates.it_foundation = { name: "IT dasturlash: Foundation", fee: +d.rate_it_foundation || 350000, teacherPercent: +d.pct_it_foundation || 50 };
    S.settings.rates.it_frontend = { name: "IT dasturlash: Frontend", fee: +d.rate_it_frontend || 450000, teacherPercent: +d.pct_it_frontend || 50 };
    S.settings.rates.it_backend = { name: "IT dasturlash: Backend", fee: +d.rate_it_backend || 500000, teacherPercent: +d.pct_it_backend || 50 };
    S.settings.rates.indiv = { name: "Individual ta'lim", fee: +d.rate_indiv || 800000, teacherPercent: +d.pct_indiv || 60 };
    save(); render();
    alert("Tariflar va foiz stavkalari saqlandi!");
  }
});

boot();
</script>
</body>
</html>
